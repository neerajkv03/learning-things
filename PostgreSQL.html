                  "Install via official PGDG apt repo, not OS defaults. Set data_directory, listen_addresses = '*', and max_connections = 200 as starting point. In prod, set shared_buffers to 25% RAM (up to 8GB), effective_cache_size to 75% RAM, and work_mem conservatively — it's per operation, not per connection.",

work_mem = 32MB
maintenance_work_mem = 512MB
wal_buffers = 16MB
max_wal_size = 4GB
checkpoint_timeout = 15min
random_page_cost = 1.1  # for SSD
effective_io_concurrency = 200

# safety
statement_timeout = '30s'
idle_in_transaction_session_timeout = '5min'
log_min_duration_statement = 1000 # ms`,

            sections: [

                id: "core",
                title: "Core types and what to default to",
                paragraphs: [
                  "Default to: BIGINT for ids (or UUID v7), TEXT with CHECK length, TIMESTAMPTZ for all times, NUMERIC(12,2) for money, JSONB for flexible payloads, BOOLEAN NOT NULL DEFAULT FALSE.",
                  "SERIAL is legacy. Use GENERATED AS IDENTITY. It respects permissions and is SQL standard.",

                codes: [

                    caption: "Sane defaults table",

  email TEXT NOT NULL CHECK (email ~* '^[^@]+@[^@]+\\.[^@]+$'),
  is_active BOOLEAN NOT NULL DEFAULT true,
  balance NUMERIC(12,2) NOT NULL DEFAULT 0 CHECK (balance >= 0),
  metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);`,
                  },
                ],
                note: {
                  type: "warn",
                  title: "Common Pitfall",

ALTER TABLE users ALTER COLUMN tier SET NOT NULL;
