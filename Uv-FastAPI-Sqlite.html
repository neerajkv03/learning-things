# SQLite wins: single tenant, <100GB, <1k writes/sec, edge deploy, local-first
# Postgres wins: >5k writes/sec, multi-region writes, heavy analytics

import sqlite3
con = sqlite3.connect("prod.db")
con.execute("PRAGMA journal_mode=WAL;")  # concurrent reads
con.execute("PRAGMA synchronous=NORMAL;")  # safe + fast in WAL
con.execute("PRAGMA foreign_keys=ON;")  # enforce FK
# WAL: readers never block, writer appends to -wal file
# Check: sqlite3 prod.db "PRAGMA journal_mode;"`,

# BAD for FastAPI - blocks event loop
def sync_query():

    async with aiosqlite.connect("prod.db") as db:

from sqlalchemy.ext.asyncio import create_async_engine, AsyncSession, async_sessionmaker
from sqlalchemy import text
import os

sqlite_file = os.getenv("DATABASE_URL", "database.db")
sqlite_url = f"sqlite:///{sqlite_file}"
async_sqlite_url = f"sqlite+aiosqlite:///{sqlite_file}"

# Sync engine - for CLI, lifespan, alembic offline
engine = create_engine(
    sqlite_url,
    echo=False,
    connect_args={"check_same_thread": False},
)

# Async engine - for FastAPI dependency
async_engine = create_async_engine(
    async_sqlite_url,
    echo=False,
    connect_args={"check_same_thread": False},
)

async_session_factory = async_sessionmaker(
    async_engine, class_=AsyncSession, expire_on_commit=False
)

def enable_wal():
    with Session(engine) as session:
        session.exec(text("PRAGMA journal_mode=WAL;"))
        session.exec(text("PRAGMA foreign_keys=ON;"))
        session.exec(text("PRAGMA synchronous=NORMAL;"))
        session.exec(text("PRAGMA cache_size=-64000;"))  # 64MB cache
        session.commit()

async def get_session():
    async with async_session_factory() as session:
        yield session
        # no commit here - service layer commits

def create_db_and_tables():
    enable_wal()
    SQLModel.metadata.create_all(engine)`,

from uuid import UUID

class UserRepository:
    async def get_by_id(self, session: AsyncSession, user_id: UUID) -> User | None:
        result = await session.exec(select(User).where(User.id == user_id))

        await session.commit()
        await session.refresh(user)

        await session.refresh(user)
        return user

from passlib.context import CryptContext
from .config import settings

pwd_context = CryptContext(schemes=["bcrypt"], deprecated="auto")
ALGORITHM = "HS256"

def get_password_hash(password: str) -> str:
    return pwd_context.hash(password)

def verify_password(plain: str, hashed: str) -> bool:
    return pwd_context.verify(plain, hashed)

def create_access_token(data: dict, expires_delta: timedelta | None = None) -> str:
    to_encode = data.copy()
    expire = datetime.now(timezone.utc) + (expires_delta or timedelta(minutes=settings.ACCESS_TOKEN_EXPIRE_MINUTES))

from sqlalchemy import text
from sqlmodel.ext.asyncio.session import AsyncSession

async def with_retry_transaction(session: AsyncSession, coro, max_retries=5):
    for attempt in range(max_retries):
        try:
            await session.exec(text("BEGIN IMMEDIATE;"))
            result = await coro()
            await session.commit()
            return result
        except Exception as e:
            await session.rollback()
            if "database is locked" in str(e).lower() and attempt < max_retries - 1:
                await asyncio.sleep(0.05 * (2 ** attempt))  # exponential backoff
                continue
            raise

# Usage in service
async def create_post_with_retry(session: AsyncSession, data):
    async def _create():
        post = Post(**data.model_dump())
        session.add(post)
        # don't commit here - outer handles
        return post

    return await with_retry_transaction(session, _create)

# Check WAL status
async def check_wal(session: AsyncSession):
    result = await session.exec(text("PRAGMA journal_mode;"))
    mode = result.first()
    print(f"journal_mode={mode}")  # should be wal
    result = await session.exec(text("PRAGMA wal_checkpoint;"))
    print(result.all())`,
