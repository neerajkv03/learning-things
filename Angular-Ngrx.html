  doubled = computed(() => this.count() * 2); // derived, memoized
  // effect - side effect, auto-tracked
  private logger = effect(() => {
    console.log(\`Count: \${this.count()} doubled: \${this.doubled()}\`);
    // untracked to read without tracking
    const now = untracked(() => Date.now());

  // effect with allowSignalWrites for advanced sync

  }, { allowSignalWrites: true });

  increment() {

  // type guard
  check(s: unknown) {

import { switchMap, pipe, tap } from 'rxjs';

type UsersState = {
  users: User[];
  query: string;
  loading: boolean;
};

export const UsersStore = signalStore(
  { providedIn: 'root' },
  withState<UsersState>({ users: [], query: '', loading: false }),
  withComputed(({ users, query }) => ({
    filteredUsers: computed(() => {
      const q = query().toLowerCase();
      return users().filter(u => u.name.toLowerCase().includes(q));
    }),
    count: computed(() => users().length)
  })),
  withMethods((store, usersService = inject(UsersService)) => ({
    setQuery(query: string) {
      patchState(store, { query });
    },
    addUser(user: User) {
      patchState(store, { users: [...store.users(), user] });
    },
    // rxMethod for async with RxJS
    loadUsers: rxMethod<void>(
      pipe(
        tap(() => patchState(store, { loading: true })),
        switchMap(() => usersService.getUsers().pipe(
          tap(users => patchState(store, { users, loading: false }))
        ))
      )
    )
  })),
  withEffects((store) => ({
    logCount: effect(() => {

    })

export const UsersActions = createActionGroup({
  source: 'Users API',
  events: {
    'Load': emptyProps(),
    'Load Success': props<{ users: User[] }>(),
    'Load Failure': props<{ error: string }>(),
    'Create': props<{ user: Partial<User> }>(),
    'Create Success': props<{ user: User }>(),
    'Update': props<{ id: string; changes: Partial<User> }>(),
    'Delete': props<{ id: string }>(),
  }
});

// users.service.ts
@Injectable({ providedIn: 'root' })
export class UsersService {
  private http = inject(HttpClient);
  getUsers() { return this.http.get<User[]>('/api/users'); }
  create(u: Partial<User>) { return this.http.post<User>('/api/users', u); }
  update(id: string, c: Partial<User>) { return this.http.patch<User>(\`/api/users/\${id}\`, c); }
  delete(id: string) { return this.http.delete(\`/api/users/\${id}\`); }
}

// users.effects.ts - functional
export const usersEffects = {
  load: createEffect((actions$ = inject(Actions), svc = inject(UsersService)) => actions$.pipe(
    ofType(UsersActions.load),
    switchMap(() => svc.getUsers().pipe(
      map(users => UsersActions.loadSuccess({ users })),
      catchError(e => of(UsersActions.loadFailure({ error: e.message })))
    ))
  ), { functional: true }),
  
  create: createEffect((actions$ = inject(Actions), svc = inject(UsersService)) => actions$.pipe(
    ofType(UsersActions.create),
    exhaustMap(({ user }) => svc.create(user).pipe(
      map(u => UsersActions.createSuccess({ user: u }))
    ))
  ), { functional: true })
};`,
