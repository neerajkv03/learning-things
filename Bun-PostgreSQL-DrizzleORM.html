    "id": "01",
    "num": "01",
    "level": "BEGINNER",
    "title": "Why No Framework",
    "why": "Bun.serve is a thin layer over a native HTTP server that speaks the standard Request/Response API, so little sits between the socket and your handler. Fewer layers means less per-request overhead and fewer surprises, but the gain only matters if you measure it on your own workload.",
    "prodTip": "Benchmark your real endpoints with the database in the loop before deciding. Query time usually dwarfs framework overhead, so choose no-framework for control and a small dependency surface, not for headline rps.",
    "subs": [
      {
        "title": "Measure, Do Not Trust Headline Numbers",
        "desc": "Throughput claims depend on hardware, payload, and whether a DB is involved. Run the same test against each candidate on your own machine. (An earlier version of this guide quoted fixed rps and ms figures; those were illustrative, not measured, and have been removed.)",
        "file": "bench/run.sh",
        "lang": "bash",
        "code": "# 1. Install a load tool (any of these works)\nbunx autocannon -c 100 -d 30 http://localhost:3000/health\n# or: oha -c 100 -z 30s http://localhost:3000/health\n\n# 2. Benchmark the endpoints that matter, not just /health:\n#    - one that hits Postgres (e.g. GET /api/users/:id)\n#    - one that does auth (Bun.password / JWT verify)\n#    - one that returns a file\n\n# 3. Record for every candidate:\n#    requests/sec, p50/p99 latency, RSS memory (ps -o rss= -p \u003cpid>),\n#    cold start (time bun src/index.ts until first 200)\n\n# 4. Compare under the SAME conditions: same box, same payload,\n#    same concurrency, warmed up, client not on the same CPU cores.\n"
      },
      {
        "title": "Cost of Abstraction",
        "desc": "Frameworks add work per request: wrapping req/res, building param and query objects, running middleware chains. Bun.serve hands you the native Request and you compose only what you need.",
        "file": "concept/overhead.ts",
        "lang": "ts",
        "code": "// Express-style: objects are built and middleware runs on every request\nfunction frameworkTax(req, res, next) {\n  req.params = {};      // allocated\n  req.query = parse();  // parsed even if unused\n  res.locals = {};      // allocated even if unused\n  next();               // then each registered middleware runs in turn\n}\n\n// Bun.serve: req is the native Request, nothing is added unless you add it\nBun.serve({\n  fetch(req) {\n    return new Response('ok');\n  }\n});\n"
      },
      {
        "title": "Built-in Routing (Bun 1.2.3+)",
        "desc": "Bun.serve now has a native routes option with :params, per-method handlers and wildcards. This guide builds a manual router in section 04 to teach how routing works; in a new project you can use routes directly and keep the same module layout.",
        "file": "src/native-routes.ts",
        "lang": "ts",
        "code": "Bun.serve({\n  routes: {\n    '/health': () => Response.json({ ok: true }),\n    '/api/users/:id': (req) => Response.json({ id: req.params.id }),\n    '/api/users': {\n      GET: () => Response.json([]),\n      POST: async (req) => Response.json(await req.json(), { status: 201 }),\n    },\n    '/public/*': () => new Response('static handler here'),\n  },\n  // anything not matched by routes\n  fetch() {\n    return new Response('Not Found', { status: 404 });\n  },\n});\n"
      }
    ]
  },

    "id": "02",

    "level": "BEGINNER",
    "title": "Bun.serve Production Entry",
    "why": "A production entry must handle SIGTERM, cap request body size, turn off development mode, never leak stack traces, and shut down in the right order: stop accepting traffic, let in-flight requests finish, then close the database pool.",
    "prodTip": "server.stop() without arguments is the graceful one (it lets in-flight requests finish). server.stop(true) force-closes active connections. Always add a hard timeout so a stuck request cannot block deploys forever.",
    "subs": [
      {
        "title": "src/index.ts — Graceful Production",
        "desc": "reusePort (Linux) lets several processes share one port. maxRequestBodySize bounds memory per request. development:false disables dev error pages.",

        "code": "import { env } from './config/env';\nimport { pg } from './config/db';\nimport { app } from './app';\nimport { logger } from './lib/logger';\n\nconst server = Bun.serve({\n  port: env.PORT,\n  hostname: '0.0.0.0',\n  reusePort: true,                     // SO_REUSEPORT: run N processes on one port (Linux)\n  idleTimeout: 30,                     // seconds\n  maxRequestBodySize: 10 * 1024 * 1024, // 10 MB; default is much larger\n  development: env.NODE_ENV !== 'production',\n\n  fetch: (req, server) => app.fetch(req, server),\n\n  // Runs only if fetch throws/rejects without your own try/catch\n  error(err) {\n    const requestId = crypto.randomUUID();\n    logger.error('fatal', { err, requestId });\n    return Response.json({ error: 'Internal Server Error', requestId }, { status: 500 });\n  },\n});\n\nlogger.info('listening', { url: server.url.href, pid: process.pid });\n\nlet shuttingDown = false;\nasync function shutdown(signal: string) {\n  if (shuttingDown) return;\n  shuttingDown = true;\n  logger.info('draining', { signal });\n\n  // Hard deadline: never hang a deploy\n  setTimeout(() => process.exit(1), 10_000).unref();\n\n  await server.stop();          // stop accepting; in-flight requests complete\n  await pg.end({ timeout: 5 }); // then close DB pool (in-flight work may still need it)\n\n  logger.info('shutdown complete');\n  process.exit(0);\n}\n\nprocess.on('SIGTERM', () => shutdown('SIGTERM'));\nprocess.on('SIGINT', () => shutdown('SIGINT'));\n"

    "title": "Request/Response Web API",
    "why": "Bun uses the standard Fetch API (Request/Response/Headers/URL/FormData), not Node's req/res. What you learn here also works on Deno, Cloudflare Workers and other web-standard runtimes.",
    "prodTip": "req.json() and req.formData() consume the body and buffer it in memory; use req.clone() before reading twice, and cap size with maxRequestBodySize. Never put a client-supplied filename into a filesystem path.",
    "subs": [
      {
        "title": "Native Web API Patterns",
        "desc": "URL, headers, JSON, safe file upload, Bun.file responses. Note: formData() buffers the upload in memory, so it is not streaming to disk; the safe pattern is to bound size, allowlist types, and generate your own filename.",
        "file": "src/app.ts",
        "lang": "ts",
        "code": "const MAX_UPLOAD = 5 * 1024 * 1024; // keep \u003c= maxRequestBodySize\nconst EXT: Record\u003cstring, string> = {\n  'image/png': '.png',\n  'image/jpeg': '.jpg',\n  'image/webp': '.webp',\n};\n\nexport const app = {\n  async fetch(req: Request): Promise\u003cResponse> {\n    const url = new URL(req.url);\n    const requestId = req.headers.get('x-request-id') || crypto.randomUUID();\n\n    if (url.pathname === '/api/json' && req.method === 'POST') {\n      const body = await req.json().catch(() => null);\n      if (body === null) return Response.json({ error: 'Invalid JSON' }, { status: 400 });\n      return Response.json({ ok: true, data: body }, { headers: { 'x-request-id': requestId } });\n    }\n\n    if (url.pathname === '/api/upload' && req.method === 'POST') {\n      const form = await req.formData();\n      const file = form.get('avatar');\n      if (!(file instanceof File)) return Response.json({ error: 'Missing file' }, { status: 400 });\n      if (file.size > MAX_UPLOAD) return Response.json({ error: 'File too large' }, { status: 413 });\n\n      // file.type is client-supplied: allowlist it (and sniff magic bytes for real safety)\n      const ext = EXT[file.type];\n      if (!ext) return Response.json({ error: 'Unsupported type' }, { status: 415 });\n\n      // NEVER use file.name in the path (../../ traversal). Generate your own name.\n      const path = `./uploads/${crypto.randomUUID()}${ext}`;\n      await Bun.write(path, file); // creates parent dirs by default\n      return Response.json({ path }, { status: 201 });\n    }\n\n    if (url.pathname === '/') {\n      // Bun serves Bun.file bodies efficiently (sendfile where supported)\n      return new Response(Bun.file('./public/index.html'), {\n        headers: { 'x-request-id': requestId },\n      });\n    }\n\n    if (url.pathname === '/health') {\n      return Response.json({ status: 'ok', uptime: process.uptime() });\n    }\n\n    return new Response('Not Found', { status: 404 });\n  },\n};\n"

    "id": "04",
    "num": "04",
    "level": "BEGINNER",
    "title": "Manual Router",
    "why": "You do not need a router library for most APIs: a route table plus compiled regexes is enough, with full type control and zero dependencies. (Bun also ships native routes, see section 01; this version shows how routing actually works.)",
    "prodTip": "Compile patterns once at startup and escape static segments. Return 405 (not 404) when the path exists with another method, and decode params safely because decodeURIComponent throws on malformed input.",
    "subs": [
      {
        "title": "lib/router.ts — Complete",
        "desc": ":param segments, * wildcard, regex-escaped static parts, 404 vs 405, safe decoding, and a next()-style compose helper.",
        "file": "src/lib/router.ts",
        "lang": "ts",
        "code": "import type { Server } from 'bun';\nimport { AppError } from './errors';\n\nexport type Params = Record\u003cstring, string>;\nexport type Handler = (req: Request, params: Params, server?: Server) => Promise\u003cResponse> | Response;\ntype Route = { method: string; pattern: RegExp; keys: string[]; handler: Handler };\n\nconst routes: Route[] = [];\n\nfunction pathToRegex(path: string) {\n  const keys: string[] = [];\n  const src = path\n    .split('/')\n    .map((seg) => {\n      if (seg === '*') { keys.push('*'); return '(.*)'; }\n      if (seg.startsWith(':')) { keys.push(seg.slice(1)); return '([^/]+)'; }\n      return seg.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'); // escape static parts\n    })\n    .join('/');\n  return { regex: new RegExp(`^${src}$`), keys };\n}\n\nexport function addRoute(method: string, path: string, handler: Handler) {\n  const { regex, keys } = pathToRegex(path);\n  routes.push({ method: method.toUpperCase(), pattern: regex, keys, handler });\n}\n\nexport const get = (p: string, h: Handler) => addRoute('GET', p, h);\nexport const post = (p: string, h: Handler) => addRoute('POST', p, h);\nexport const put = (p: string, h: Handler) => addRoute('PUT', p, h);\nexport const del = (p: string, h: Handler) => addRoute('DELETE', p, h);\n\ntype Match =\n  | { kind: 'match'; handler: Handler; params: Params }\n  | { kind: 'method' }\n  | { kind: 'none' };\n\nfunction matchRoute(method: string, pathname: string): Match {\n  let pathMatched = false;\n  for (const r of routes) {\n    const m = pathname.match(r.pattern);\n    if (!m) continue;\n    pathMatched = true;\n    if (r.method !== method) continue;\n    const params: Params = {};\n    try {\n      r.keys.forEach((k, i) => (params[k] = decodeURIComponent(m[i + 1])));\n    } catch {\n      throw new AppError('Malformed URL encoding', 400);\n    }\n    return { kind: 'match', handler: r.handler, params };\n  }\n  return pathMatched ? { kind: 'method' } : { kind: 'none' };\n}\n\nexport async function router(req: Request, server?: Server): Promise\u003cResponse> {\n  const { pathname } = new URL(req.url);\n  const m = matchRoute(req.method, pathname);\n  if (m.kind === 'match') return m.handler(req, m.params, server);\n  if (m.kind === 'method') return Response.json({ error: 'Method Not Allowed' }, { status: 405 });\n  return Response.json({ error: 'Not Found' }, { status: 404 });\n}\n\n// Optional: Express-style composition without global state\nexport type Middleware = (req: Request, next: () => Promise\u003cResponse>) => Promise\u003cResponse>;\n\nexport function compose(...mws: Middleware[]) {\n  return (req: Request, final: () => Promise\u003cResponse>) => {\n    let idx = -1;\n    const dispatch = (i: number): Promise\u003cResponse> => {\n      if (i \u003c= idx) return Promise.reject(new Error('next() called multiple times'));\n      idx = i;\n      if (i === mws.length) return final();\n      return mws[i](req, () => dispatch(i + 1));\n    };\n    return dispatch(0);\n  };\n}\n"
      }
    ]
  },

        "desc": "Zod validation with fail-fast exit. Uses error.issues (works in zod 3 and 4) and a scheme check instead of z.string().url(), which behaves differently across versions.",
        "file": "src/config/env.ts",
        "lang": "ts",
        "code": "import { z } from 'zod';\n\nconst bool = z.enum(['true', 'false']).default('false').transform((v) => v === 'true');\n\nconst schema = z.object({\n  NODE_ENV: z.enum(['development', 'production', 'test']).default('development'),\n  PORT: z.coerce.number().int().min(1).max(65535).default(3000),\n  DATABASE_URL: z\n    .string()\n    .refine((v) => /^postgres(ql)?:\\/\\//.test(v), 'must be a postgres:// URL'),\n  JWT_SECRET: z.string().min(32),\n  // comma-separated allowlist, e.g. \"https://app.example.com,https://admin.example.com\"\n  CORS_ORIGINS: z.string().default('').transform((s) => s.split(',').map((x) => x.trim()).filter(Boolean)),\n  LOG_LEVEL: z.enum(['debug', 'info', 'warn', 'error']).default('info'),\n  DB_POOL_MAX: z.coerce.number().int().min(1).default(10),\n  PGBOUNCER_TXN_MODE: bool,  // true only if using PgBouncer in transaction pooling mode\n  TRUST_PROXY: bool,         // true only when behind Caddy/nginx you control\n});\n\nfunction validateEnv() {\n  const parsed = schema.safeParse(Bun.env);\n  if (!parsed.success) {\n    console.error('Invalid environment:');\n    for (const i of parsed.error.issues) console.error(`  - ${i.path.join('.')}: ${i.message}`);\n    process.exit(1);\n  }\n  return parsed.data;\n}\n\nexport const env = validateEnv();\n// Bun auto-loads .env, .env.local and .env.\u003cNODE_ENV>. No dotenv needed.\n"

    "title": "Middlewares Without Framework",
    "why": "CORS, auth, and rate limiting are plain functions that return a Response (to short-circuit) or null/the user (to continue). No framework needed, but each one has security details that are easy to get wrong.",
    "prodTip": "Never reflect any Origin back (that defeats CORS). Never trust x-forwarded-for unless a proxy you control sets it. In-memory rate limiting is per process; with reusePort or several replicas, use a shared store.",
    "subs": [
      {
        "title": "cors.ts — Allowlist",
        "desc": "Origins come from CORS_ORIGINS. Headers are set in place (so Bun.file responses are not re-wrapped), with a fallback copy if the Response headers are immutable. Never combine * with credentials.",
        "file": "src/middlewares/cors.ts",
        "lang": "ts",
        "code": "import { env } from '../config/env';\n\nconst allowed = new Set(env.CORS_ORIGINS);\n\nfunction originFor(req: Request): string | null {\n  const origin = req.headers.get('origin');\n  if (!origin) return null;\n  if (allowed.has('*')) return '*';\n  return allowed.has(origin) ? origin : null;\n}\n\nfunction setCors(res: Response, origin: string) {\n  res.headers.set('Access-Control-Allow-Origin', origin);\n  res.headers.append('Vary', 'Origin');\n  res.headers.set('Access-Control-Expose-Headers', 'X-Request-Id');\n}\n\nexport function applyCors(req: Request, res: Response): Response {\n  const origin = originFor(req);\n  if (!origin) return res;\n  try {\n    setCors(res, origin);\n    return res;\n  } catch {\n    const copy = new Response(res.body, res); // immutable headers (e.g. redirects)\n    setCors(copy, origin);\n    return copy;\n  }\n}\n\nexport function handleOptions(req: Request): Response | null {\n  if (req.method !== 'OPTIONS') return null;\n  const origin = originFor(req);\n  if (!origin) return new Response(null, { status: 403 });\n  return new Response(null, {\n    status: 204,\n    headers: {\n      'Access-Control-Allow-Origin': origin,\n      'Access-Control-Allow-Methods': 'GET,POST,PUT,DELETE,OPTIONS',\n      'Access-Control-Allow-Headers': 'Content-Type, Authorization, X-Request-Id',\n      'Access-Control-Max-Age': '86400',\n      Vary: 'Origin',\n    },\n  });\n}\n"
      },

        "title": "utils/jwt.ts — Sign + Verify",
        "desc": "This file was referenced but missing in the original. Uses the jose library (Web Crypto, runs on Bun). The algorithm is pinned on verify to prevent algorithm-confusion attacks. Install: bun add jose.",
        "file": "src/utils/jwt.ts",
        "lang": "ts",
        "code": "import { SignJWT, jwtVerify } from 'jose';\nimport { env } from '../config/env';\n\nconst secret = new TextEncoder().encode(env.JWT_SECRET);\n\nexport type JwtPayload = { sub: string; role: 'user' | 'admin' };\n\nexport function signJwt(p: JwtPayload, ttl = '15m') {\n  return new SignJWT({ role: p.role })\n    .setProtectedHeader({ alg: 'HS256' })\n    .setSubject(p.sub)\n    .setIssuedAt()\n    .setExpirationTime(ttl)\n    .sign(secret);\n}\n\nexport async function verifyJwt(token: string): Promise\u003cJwtPayload> {\n  const { payload } = await jwtVerify(token, secret, { algorithms: ['HS256'] });\n  if (typeof payload.sub !== 'string' || (payload.role !== 'user' && payload.role !== 'admin')) {\n    throw new Error('Invalid claims');\n  }\n  return { sub: payload.sub, role: payload.role };\n}\n"

        "file": "src/middlewares/auth.ts",
        "lang": "ts",
        "code": "import type { Handler, Params } from '../lib/router';\nimport { verifyJwt, type JwtPayload } from '../utils/jwt';\n\nexport type AuthedHandler = (\n  req: Request,\n  params: Params,\n  user: JwtPayload,\n  server?: any,\n) => Response | Promise\u003cResponse>;\n\nasync function authenticate(req: Request): Promise\u003cJwtPayload | null> {\n  const header = req.headers.get('authorization');\n  if (!header?.startsWith('Bearer ')) return null;\n  try {\n    return await verifyJwt(header.slice(7));\n  } catch {\n    return null;\n  }\n}\n\nexport const withAuth =\n  (handler: AuthedHandler): Handler =>\n  async (req, params, server) => {\n    const user = await authenticate(req);\n    if (!user) return Response.json({ error: 'Unauthorized' }, { status: 401 });\n    return handler(req, params, user, server);\n  };\n"

      {
        "title": "rateLimiter.ts — Fixed Window",
        "desc": "A fixed-window counter (the original called it sliding window). Client IP comes from the socket; x-forwarded-for is only used when TRUST_PROXY is set, and then only the last entry (the one your own proxy appended).",
        "file": "src/middlewares/rateLimiter.ts",
        "lang": "ts",
        "code": "import type { Server } from 'bun';\nimport { env } from '../config/env';\n\nconst WINDOW_MS = 60_000;\nconst MAX = 100;\nconst hits = new Map\u003cstring, { count: number; reset: number }>();\n\nsetInterval(() => {\n  const now = Date.now();\n  for (const [k, v] of hits) if (v.reset \u003c= now) hits.delete(k);\n}, 60_000).unref();\n\nfunction clientIp(req: Request, server?: Server): string {\n  if (env.TRUST_PROXY) {\n    const xff = req.headers.get('x-forwarded-for');\n    if (xff) return xff.split(',').map((s) => s.trim()).pop()!;\n  }\n  return server?.requestIP(req)?.address ?? 'unknown';\n}\n\nexport function rateLimiter(req: Request, server?: Server): Response | null {\n  const ip = clientIp(req, server);\n  const now = Date.now();\n  const entry = hits.get(ip);\n\n  if (!entry || entry.reset \u003c= now) {\n    hits.set(ip, { count: 1, reset: now + WINDOW_MS });\n    return null;\n  }\n  if (++entry.count > MAX) {\n    return Response.json(\n      { error: 'Too many requests' },\n      { status: 429, headers: { 'Retry-After': String(Math.ceil((entry.reset - now) / 1000)) } },\n    );\n  }\n  return null;\n}\n"

        "code": "import { env } from '../../config/env';\nimport { verifyJwt } from '../../utils/jwt';\n\ntype WSData = { userId: string; room: string };\nconst allowedOrigins = new Set(env.CORS_ORIGINS);\n\nconst server = Bun.serve({\n  port: 3000,\n  async fetch(req, server) {\n    const url = new URL(req.url);\n    if (url.pathname !== '/ws') return new Response('Not Found', { status: 404 });\n\n    const origin = req.headers.get('origin');\n    if (origin && !allowedOrigins.has(origin)) return new Response('Forbidden', { status: 403 });\n\n    const token = url.searchParams.get('token');\n    const user = token ? await verifyJwt(token).catch(() => null) : null;\n    if (!user) return new Response('Unauthorized', { status: 401 });\n\n    const room = (url.searchParams.get('room') || 'general').slice(0, 64);\n    // TODO: check this user is allowed in this room\n\n    if (server.upgrade(req, { data: { userId: user.sub, room } })) return;\n    return new Response('Upgrade failed', { status: 400 });\n  },\n  websocket: {\n    data: {} as WSData,\n    idleTimeout: 60,\n    maxPayloadLength: 64 * 1024,\n    open(ws) {\n      ws.subscribe(ws.data.room);\n    },\n    message(ws, msg) {\n      if (typeof msg !== 'string') return; // ignore binary\n      // server.publish also delivers to the sender (ws.publish does not)\n      server.publish(ws.data.room, JSON.stringify({ from: ws.data.userId, text: msg }));\n    },\n    close(ws) {\n      ws.unsubscribe(ws.data.room);\n    },\n  },\n});\n"

        "code": "import { appendFile, readdir, mkdir } from 'node:fs/promises';\n\n// Read (lazy: nothing is read until you call a reader)\nconst pkg = await Bun.file('./package.json').json();\nconst text = await Bun.file('./data.csv').text();\nconst buf = await Bun.file('./logo.png').arrayBuffer();\nconst exists = await Bun.file('./config.json').exists();\nconst size = Bun.file('./video.mp4').size; // no read; 0 if the file does not exist\nconst mime = Bun.file('./logo.png').type;  // image/png\n\n// Write: OVERWRITES, creates parent dirs automatically\nawait Bun.write('./logs/app.log', 'first line\\n');\n\n// Append is NOT Bun.write: use node:fs\nawait appendFile('./logs/app.log', 'another line\\n');\n\n// Directory listing / mkdir: node:fs\nconst names = await readdir('./uploads');\nawait mkdir('./data', { recursive: true });\n"

        "title": "lib/files.ts — Safe Static, Range, Upload",
        "desc": "servePublic blocks path traversal by resolving and checking the prefix. serveFile adds Range support (video seeking). saveUpload bounds size and type and generates its own filename.",
        "file": "src/lib/files.ts",
        "lang": "ts",
        "code": "import { resolve, sep } from 'node:path';\nimport { AppError } from './errors';\n\nconst ROOT = resolve('./public');\n\nexport async function servePublic(rel: string): Promise\u003cResponse> {\n  const full = resolve(ROOT, rel);\n  if (full !== ROOT && !full.startsWith(ROOT + sep)) return new Response('Not Found', { status: 404 });\n  const file = Bun.file(full);\n  if (!(await file.exists())) return new Response('Not Found', { status: 404 });\n  return new Response(file, { headers: { 'Cache-Control': 'public, max-age=3600' } });\n}\n\nexport async function serveFile(req: Request, path: string): Promise\u003cResponse> {\n  const file = Bun.file(path);\n  if (!(await file.exists())) return new Response('Not Found', { status: 404 });\n  const size = file.size;\n  const m = /^bytes=(\\d*)-(\\d*)$/.exec(req.headers.get('range') ?? '');\n  if (!m || (!m[1] && !m[2])) {\n    return new Response(file, { headers: { 'Accept-Ranges': 'bytes' } });\n  }\n  let start: number, end: number;\n  if (!m[1]) { start = Math.max(size - Number(m[2]), 0); end = size - 1; } // suffix range\n  else { start = Number(m[1]); end = m[2] ? Math.min(Number(m[2]), size - 1) : size - 1; }\n  if (start > end || start >= size) {\n    return new Response(null, { status: 416, headers: { 'Content-Range': `bytes */${size}` } });\n  }\n  return new Response(file.slice(start, end + 1), {\n    status: 206,\n    headers: {\n      'Content-Range': `bytes ${start}-${end}/${size}`,\n      'Accept-Ranges': 'bytes',\n      'Content-Type': file.type,\n    },\n  });\n}\n\nconst MAX_UPLOAD = 5 * 1024 * 1024;\nconst EXT: Record\u003cstring, string> = { 'image/png': '.png', 'image/jpeg': '.jpg', 'image/webp': '.webp' };\n\nexport async function saveUpload(req: Request): Promise\u003cResponse> {\n  const form = await req.formData();\n  const file = form.get('file');\n  if (!(file instanceof File)) throw new AppError('No file', 400);\n  if (file.size > MAX_UPLOAD) throw new AppError('File too large', 413);\n  const ext = EXT[file.type];\n  if (!ext) throw new AppError('Unsupported file type', 415);\n\n  const path = `./uploads/${crypto.randomUUID()}${ext}`; // never file.name\n  await Bun.write(path, file);\n\n  const hasher = new Bun.CryptoHasher('sha256');\n  hasher.update(await file.arrayBuffer());\n  return Response.json({ path, size: file.size, sha256: hasher.digest('hex') }, { status: 201 });\n}\n"

        "code": "import { Database } from 'bun:sqlite';\n\nconst db = new Database('./data/cache.db', { create: true });\n\ndb.exec('PRAGMA journal_mode = WAL;');   // concurrent readers during writes\ndb.exec('PRAGMA synchronous = NORMAL;'); // safe with WAL, faster than FULL\ndb.exec('PRAGMA busy_timeout = 5000;');  // wait instead of failing on lock\ndb.exec('PRAGMA cache_size = -64000;');  // negative = KiB (64 MB)\n\ndb.exec(`\n  CREATE TABLE IF NOT EXISTS cache (\n    key TEXT PRIMARY KEY,\n    value TEXT NOT NULL,\n    expires_at INTEGER NOT NULL\n  );\n  CREATE INDEX IF NOT EXISTS idx_cache_expires ON cache(expires_at);\n`);\n\nconst setStmt = db.query('INSERT OR REPLACE INTO cache (key, value, expires_at) VALUES (?1, ?2, ?3)');\nconst getStmt = db.query('SELECT value FROM cache WHERE key = ?1 AND expires_at > ?2');\nconst delStmt = db.query('DELETE FROM cache WHERE key = ?1');\nconst sweepStmt = db.query('DELETE FROM cache WHERE expires_at \u003c= ?1');\n\nsetInterval(() => sweepStmt.run(Date.now()), 60_000).unref();\n\nexport const cache = {\n  set: (key: string, value: unknown, ttlMs = 3_600_000) => {\n    setStmt.run(key, JSON.stringify(value), Date.now() + ttlMs);\n  },\n  get: \u003cT>(key: string): T | null => {\n    const row = getStmt.get(key, Date.now()) as { value: string } | null;\n    return row ? (JSON.parse(row.value) as T) : null;\n  },\n  del: (key: string) => delStmt.run(key),\n};\n"

        "desc": "One atomic upsert resets the window when it has expired and increments otherwise. (The original never reset the window in the SQL and ran a full-table DELETE on every request, with string-concatenated SQL.) RETURNING needs SQLite 3.35+, which Bun bundles.",

        "code": "import { Database } from 'bun:sqlite';\n\nconst db = new Database('./data/ratelimit.db', { create: true });\ndb.exec('PRAGMA journal_mode = WAL;');\ndb.exec('PRAGMA busy_timeout = 5000;');\ndb.exec('CREATE TABLE IF NOT EXISTS hits (ip TEXT PRIMARY KEY, count INTEGER NOT NULL, reset_at INTEGER NOT NULL)');\n\nconst hit = db.query(`\n  INSERT INTO hits (ip, count, reset_at) VALUES (?1, 1, ?2)\n  ON CONFLICT(ip) DO UPDATE SET\n    count    = CASE WHEN reset_at \u003c= ?3 THEN 1  ELSE count + 1 END,\n    reset_at = CASE WHEN reset_at \u003c= ?3 THEN ?2 ELSE reset_at END\n  RETURNING count, reset_at\n`);\nconst sweep = db.query('DELETE FROM hits WHERE reset_at \u003c= ?1');\nsetInterval(() => sweep.run(Date.now()), 60_000).unref();\n\nconst WINDOW_MS = 60_000;\nconst MAX = 100;\n\nexport function rateLimitSqlite(ip: string) {\n  const now = Date.now();\n  const row = hit.get(ip, now + WINDOW_MS, now) as { count: number; reset_at: number };\n  if (row.count > MAX) {\n    return { limited: true, retryAfter: Math.ceil((row.reset_at - now) / 1000) };\n  }\n  return { limited: false, retryAfter: 0 };\n}\n"

        "code": "import { timingSafeEqual } from 'node:crypto';\n\n// SHA-256, streaming\nconst hasher = new Bun.CryptoHasher('sha256');\nhasher.update('hello');\nhasher.update(' world');\nconst hex = hasher.digest('hex'); // also 'base64', 'base64url'\n\n// HMAC (e.g. webhook signatures): pass the key as 2nd argument\nconst sig = new Bun.CryptoHasher('sha256', 'webhook-secret').update('payload').digest('hex');\n\nfunction safeEqual(a: string, b: string) {\n  const ab = Buffer.from(a), bb = Buffer.from(b);\n  return ab.length === bb.length && timingSafeEqual(ab, bb); // constant time\n}\n\n// Fast NON-crypto hash for cache keys\nconst key = Bun.hash('user:123');        // bigint (wyhash, 64-bit)\nconst keyStr = key.toString(16);\nconst crc = Bun.hash.crc32('data');      // number\n\n// Gzip\nconst original = Buffer.from('big data repeated '.repeat(1000));\nconst compressed = Bun.gzipSync(original);\nconsole.log(`${original.length} bytes -> ${compressed.length} bytes`);\nconst restored = Bun.gunzipSync(compressed);\nconsole.log(new TextDecoder().decode(restored).length);\n\n// Cheap ETag from size + mtime (no file read)\nexport async function serveWithETag(req: Request, path: string) {\n  const file = Bun.file(path);\n  if (!(await file.exists())) return new Response('Not Found', { status: 404 });\n\n  const etag = `W/\"${file.size.toString(16)}-${Math.floor(file.lastModified).toString(16)}\"`;\n  if (req.headers.get('if-none-match') === etag) {\n    return new Response(null, { status: 304, headers: { ETag: etag } });\n  }\n  return new Response(file, {\n    headers: { ETag: etag, 'Cache-Control': 'public, max-age=3600' },\n  });\n}\n"

        "code": "import type { Server } from 'bun';\nimport { router, get, post } from './lib/router';\nimport { applyCors, handleOptions } from './middlewares/cors';\nimport { rateLimiter } from './middlewares/rateLimiter';\nimport { getRequestId } from './middlewares/requestId';\nimport { errorHandler } from './lib/errors';\nimport { servePublic, saveUpload } from './lib/files';\nimport { applySecurityHeaders } from './lib/security';\nimport { registerUserRoutes } from './modules/users/user.routes';\nimport { withAuth } from './middlewares/auth';\nimport { pg } from './config/db';\nimport { logger } from './lib/logger';\n\n// --- routes ---\nget('/health', () => Response.json({ ok: true, uptime: process.uptime() })); // liveness\nget('/ready', async () => {                                                  // readiness\n  try {\n    await pg`select 1`;\n    return Response.json({ ready: true });\n  } catch {\n    return Response.json({ ready: false }, { status: 503 });\n  }\n});\nget('/public/*', (_req, params) => servePublic(params['*']));\npost('/api/upload', withAuth((req) => saveUpload(req)));\nregisterUserRoutes();\n\n// --- response helpers ---\nfunction setHeader(res: Response, k: string, v: string): Response {\n  try {\n    res.headers.set(k, v);\n    return res;\n  } catch {\n    const copy = new Response(res.body, res); // immutable headers\n    copy.headers.set(k, v);\n    return copy;\n  }\n}\n\n// --- app ---\nexport const app = {\n  async fetch(req: Request, server: Server): Promise\u003cResponse> {\n    const requestId = getRequestId(req);\n    const start = performance.now();\n    const { pathname } = new URL(req.url);\n\n    let res: Response;\n    try {\n      res = handleOptions(req) ?? rateLimiter(req, server) ?? (await router(req, server));\n    } catch (err) {\n      res = errorHandler(err, requestId);\n    }\n\n    res = applyCors(req, res);\n    res = applySecurityHeaders(res);\n    res = setHeader(res, 'x-request-id', requestId);\n\n    const ms = Math.round(performance.now() - start);\n    logger.info('request', { requestId, method: req.method, path: pathname, status: res.status, ms });\n    return res;\n  },\n};\n"

        "title": "Transactions + Row Locks",
        "desc": "Move money atomically. Both rows are locked in a fixed id order (prevents deadlocks) with FOR UPDATE, so two concurrent transfers cannot overspend.",
        "file": "src/modules/accounts/account.service.ts",
        "lang": "ts",
        "code": "import { eq, inArray, sql } from 'drizzle-orm';\nimport { pgTable, uuid, integer } from 'drizzle-orm/pg-core';\nimport { db } from '../../config/db';\nimport { AppError } from '../../lib/errors';\n\nexport const accounts = pgTable('accounts', {\n  id: uuid('id').primaryKey().defaultRandom(),\n  balanceCents: integer('balance_cents').notNull(),\n});\n\nexport async function transfer(fromId: string, toId: string, amountCents: number) {\n  if (!Number.isInteger(amountCents) || amountCents \u003c= 0) throw new AppError('Invalid amount', 400);\n  if (fromId === toId) throw new AppError('Same account', 400);\n\n  await db.transaction(async (tx) => {\n    // lock both rows in a deterministic order\n    const rows = await tx\n      .select()\n      .from(accounts)\n      .where(inArray(accounts.id, [fromId, toId]))\n      .orderBy(accounts.id)\n      .for('update');\n\n    const from = rows.find((r) => r.id === fromId);\n    if (!from || rows.length !== 2) throw new AppError('Account not found', 404);\n    if (from.balanceCents \u003c amountCents) throw new AppError('Insufficient funds', 409);\n\n    await tx.update(accounts)\n      .set({ balanceCents: sql`${accounts.balanceCents} - ${amountCents}` })\n      .where(eq(accounts.id, fromId));\n    await tx.update(accounts)\n      .set({ balanceCents: sql`${accounts.balanceCents} + ${amountCents}` })\n      .where(eq(accounts.id, toId));\n  }); // any throw above rolls everything back\n}\n"
