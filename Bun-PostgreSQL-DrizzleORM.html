  async fetch(req: Request): Promise<Response> {
    const url = new URL(req.url);
    
    // Headers - case insensitive
    const auth = req.headers.get('authorization');
    const requestId = req.headers.get('x-request-id') || crypto.randomUUID();

    if (url.pathname === '/api/json' && req.method === 'POST') {
      // Safe parse - never trust
      const body = await req.json().catch(() => null);
      if (!body) return Response.json({ error: 'Invalid JSON' }, { status: 400 });
      return Response.json({ ok: true, data: body }, { headers: { 'x-request-id': requestId } });
    }

    if (url.pathname === '/api/upload' && req.method === 'POST') {
      const form = await req.formData();
      const file = form.get('avatar') as File | null;
      if (!file) return Response.json({ error: 'Missing file' }, { status: 400 });
      
      // Direct stream to disk - zero memory copy
      const path = \`./uploads/\${crypto.randomUUID()}-\${file.name}\`;
      await Bun.write(path, file);
      return Response.json({ path });
    }

    if (url.pathname === '/') {
      // Zero-copy file response - kernel sendfile
      return new Response(Bun.file('./public/index.html'), {
        headers: { 'Content-Type': 'text/html', 'x-request-id': requestId }
      });
    }

    if (url.pathname === '/health') {
      return Response.json({ status: 'ok', uptime: process.uptime() });
    }

    return new Response('Not Found', { status: 404 });
  }

              lang: "ts",
              code: `type Handler = (req: Request, params: Record<string,string>, server?: any) => Promise<Response> | Response;
type Route = { method: string; pattern: RegExp; keys: string[]; handler: Handler; };

const routes: Route[] = [];

function pathToRegex(path: string) {
  const keys: string[] = [];
  const pattern = path.replace(/:([^/]+)/g, (_, key) => {
    keys.push(key);
    return '([^/]+)';
  });
  return { regex: new RegExp(\`^\${pattern}$\`), keys };
}

export function addRoute(method: string, path: string, handler: Handler) {
  const { regex, keys } = pathToRegex(path);
  routes.push({ method: method.toUpperCase(), pattern: regex, keys, handler });
}

export const get = (p: string, h: Handler) => addRoute('GET', p, h);
export const post = (p: string, h: Handler) => addRoute('POST', p, h);
export const put = (p: string, h: Handler) => addRoute('PUT', p, h);
export const del = (p: string, h: Handler) => addRoute('DELETE', p, h);

function matchRoute(method: string, pathname: string) {
  for (const r of routes) {
    if (r.method !== method) continue;
    const m = pathname.match(r.pattern);
    if (!m) continue;
    const params: Record<string,string> = {};
    r.keys.forEach((k, i) => params[k] = m[i+1]);
    return { handler: r.handler, params };
  }
  return null;
}

// compose without Express-style next()
export function compose(...middlewares: ((req: Request, next: () => Promise<Response>) => Promise<Response>)[]) {
  return async (req: Request, final: () => Promise<Response>) => {
    let idx = -1;
    async function dispatch(i: number): Promise<Response> {
      if (i <= idx) throw new Error('next() called multiple times');
      idx = i;
      const fn = i === middlewares.length ? final : middlewares[i];
      return fn(req, () => dispatch(i+1));
    }
    return dispatch(0);
  };
}

export async function router(req: Request, server?: any): Promise<Response> {
  const { pathname } = new URL(req.url);
  const matched = matchRoute(req.method, pathname);
  if (!matched) return new Response('Not Found', { status: 404 });
  return matched.handler(req, matched.params, server);
}`,

  headers.set('Access-Control-Allow-Origin', origin);

export async function auth(req: Request): Promise<Response | null> {
  const header = req.headers.get('authorization');
  if (!header?.startsWith('Bearer ')) {
    return Response.json({ error: 'Unauthorized' }, { status: 401 });

  const token = header.slice(7);

              lang: "ts",
              code: `const hits = new Map<string, { count: number; reset: number }>();
const WINDOW = 60_000; // 1 min
const MAX = 100;

// cleanup every 5 min
setInterval(() => {
  const now = Date.now();
  for (const [k, v] of hits) if (v.reset < now) hits.delete(k);
}, 5 * 60_000).unref();

export function rateLimiter(req: Request): Response | null {
  const ip = req.headers.get('x-forwarded-for') || '127.0.0.1';
  const now = Date.now();
  const entry = hits.get(ip);

  if (!entry || entry.reset < now) {
    hits.set(ip, { count: 1, reset: now + WINDOW });
    return null;
  }

  entry.count++;
  if (entry.count > MAX) {
    return Response.json({ error: 'Too many requests' }, { 
      status: 429,
      headers: { 'Retry-After': String(Math.ceil((entry.reset - now)/1000)) }
    });
  }
  return null;
}`,

import { AppError } from './errors';

export async function validateBody<T extends z.ZodType>(req: Request, schema: T): Promise<z.infer<T>> {
  const json = await req.json().catch(() => null);
  if (!json) throw new AppError('Invalid JSON body', 400);

  const result = schema.safeParse(json);
  if (!result.success) {
    const msg = result.error.errors.map(e => \`\${e.path.join('.')}: \${e.message}\`).join(', ');
    throw new AppError(msg, 400);
  }
  return result.data;
}`,
