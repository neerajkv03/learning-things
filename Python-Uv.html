from dataclasses import dataclass, field
from datetime import datetime, timezone
from typing import ClassVar
from uuid import UUID, uuid4
from enum import Enum

class Role(str, Enum):
    USER = "user"
    ADMIN = "admin"

@dataclass(frozen=True, slots=True)
class User:
    email: str
    name: str
    id: UUID = field(default_factory=uuid4)
    role: Role = Role.USER
    created_at: datetime = field(default_factory=lambda: datetime.now(timezone.utc))

    MAX_NAME_LEN: ClassVar[int] = 100

    def __post_init__(self) -> None:
        if len(self.name) > self.MAX_NAME_LEN:
            raise ValueError("name too long")
        if "@" not in self.email:
            raise ValueError("invalid email")

    @property
    def is_admin(self) -> bool:
        return self.role == Role.ADMIN

    @classmethod
    def create_admin(cls, email: str, name: str) -> "User":
        return cls(email=email, name=name, role=Role.ADMIN)

    @staticmethod
    def normalize_email(email: str) -> str:
        return email.strip().lower()`,

from contextlib import contextmanager
from typing import Iterator, Generator

# 1. contextmanager decorator - resource safety
@contextmanager
def temp_file() -> Iterator[str]:
    import tempfile, os
    path = tempfile.mktemp()
    try:
        yield path
    finally:
        if os.path.exists(path):
            os.remove(path)

# usage: with temp_file() as p: ...

# 2. generator - memory efficient
def read_large_file(path: str) -> Generator[str, None, None]:
    with open(path) as f:
        for line in f:
            yield line.strip()

# 3. decorators with functools.wraps
from functools import wraps
def retry(max_attempts: int = 3):
    def deco(func):
        @wraps(func)
        def wrapper(*args, **kwargs):
            for attempt in range(max_attempts):
                try:
                    return func(*args, **kwargs)
                except Exception:
                    if attempt == max_attempts - 1:
                        raise
        return wrapper
    return deco

# args/kwargs prod use
def log_event(event: str, *args: object, **kwargs: object) -> None:
    print(f"[{event}] args={args} kwargs={kwargs}")`,

from collections.abc import Callable, Sequence
from typing import TypedDict, Protocol, TypeVar, Self
from dataclasses import dataclass

# modern syntax - no typing.List/Dict
def get_users(ids: list[int]) -> dict[int, str]:
    return {i: f"user-{i}" for i in ids}

# X | Y not Optional[X] / Union[X, Y]
def find_user(id: int) -> str | None:
    return None if id == 0 else f"user-{id}"

# TypedDict for JSON shapes
class UserJson(TypedDict):
    id: int
    email: str
    name: str

def parse_user(data: UserJson) -> str:
    return data["email"]

# Protocol - structural typing
class Logger(Protocol):
    def log(self, msg: str) -> None: ...

class ConsoleLogger:
    def log(self, msg: str) -> None:
        print(msg)

def process(logger: Logger) -> None:
    logger.log("hi")

# Generics
T = TypeVar("T")

@dataclass(frozen=True, slots=True)
class Result[T]:
    value: T
    ok: bool

    def map[U](self, fn: Callable[[T], U]) -> "Result[U]":
        return Result(fn(self.value), self.ok)

from typing import Protocol
from uuid import UUID
from ..models.user import User
from ..repositories.user_repo import UserRepository
from ..core.exceptions import UserNotFound

class UserService:
    def __init__(self, repo: UserRepository) -> None:
        self._repo = repo  # DI, not global

    async def get_by_id(self, user_id: UUID) -> User:
        user = await self._repo.get(user_id)
        if not user:
            raise UserNotFound(str(user_id))
        return user

    async def create(self, email: str, name: str) -> User:
        if await self._repo.get_by_email(email):
            raise ValueError(f"email exists: {email}")
        user = User.create(email=email, name=name)
        return await self._repo.save(user)

# protocol for repo - for testing

    async def get(self, id: UUID) -> User | None: ...
    async def get_by_email(self, email: str) -> User | None: ...
    async def save(self, user: User) -> User: ...`,

import asyncio
from typing import AsyncGenerator
import httpx

# 1. basic async/await
async def fetch_user(user_id: int) -> dict:
    async with httpx.AsyncClient() as client:
        r = await client.get(f"https://httpbin.org/get?id={user_id}")
        return r.json()

# 2. gather - fan-out, run concurrently
async def fetch_many(ids: list[int]) -> list[dict]:
    # runs all at once, not sequential
    results = await asyncio.gather(*[fetch_user(i) for i in ids])
    return results

# 3. create_task - background work
async def background_task() -> None:
    await asyncio.sleep(1)
    print("background done")

async def main() -> None:
    task = asyncio.create_task(background_task())
    print("doing other work")
    await task  # wait for background

# 4. async context manager
class AsyncDB:
    async def __aenter__(self) -> "AsyncDB":
        print("connect")
        return self
    async def __aexit__(self, *args) -> None:
        print("disconnect")

# 5. async generator
async def stream_numbers() -> AsyncGenerator[int, None]:
    for i in range(5):

        yield i

from fastapi import APIRouter
import asyncio
import httpx

router = APIRouter()

@router.get("/users/{id}")
async def get_user(id: int):
    # async def = non-blocking, event loop can handle other requests
    async with httpx.AsyncClient() as client:
        # don't use requests here, it's blocking
        resp = await client.get(f"https://api.example.com/users/{id}")
        return resp.json()

@router.get("/parallel")
async def parallel_fetch():
    # gather 3 calls concurrently - total time = slowest, not sum
    async with httpx.AsyncClient() as client:
        results = await asyncio.gather(
            client.get("https://httpbin.org/delay/1"),
            client.get("https://httpbin.org/delay/1"),
            client.get("https://httpbin.org/delay/1"),
        )
    return {"count": len(results), "parallel": True}

FROM ghcr.io/astral-sh/uv:python3.12-bookworm-slim AS base

# uv env vars
ENV UV_COMPILE_BYTECODE=1     UV_LINK_MODE=copy     UV_PYTHON_DOWNLOADS=never     PYTHONUNBUFFERED=1     PYTHONDONTWRITEBYTECODE=1

WORKDIR /app

# layer cache: deps first
COPY pyproject.toml uv.lock ./
RUN --mount=type=cache,target=/root/.cache/uv     uv sync --frozen --no-dev --no-install-project

# then project
COPY src/ src/
COPY README.md ./
RUN --mount=type=cache,target=/root/.cache/uv     uv sync --frozen --no-dev

# final stage - distroless-ish
FROM base AS final
# don't run as root
RUN useradd -m appuser
USER appuser

# use uv run for entrypoint

# 1. Domain model - frozen dataclass
from dataclasses import dataclass
from datetime import datetime, timezone
from uuid import UUID, uuid4

@dataclass(frozen=True, slots=True)
class User:
    id: UUID
    email: str
    name: str
    created_at: datetime

    @classmethod
    def create(cls, email: str, name: str) -> "User":
        return cls(id=uuid4(), email=email, name=name, created_at=datetime.now(timezone.utc))

# 2. Pydantic schemas - API validation
from pydantic import BaseModel, EmailStr, Field
from datetime import datetime
from uuid import UUID

class UserCreate(BaseModel):
    email: EmailStr
    name: str = Field(min_length=1, max_length=100)

class UserUpdate(BaseModel):
    name: str | None = Field(default=None, min_length=1, max_length=100)

class UserOut(BaseModel):
    id: UUID
    email: str
    name: str
    created_at: datetime
    model_config = {"from_attributes": True}

# 3. SQLAlchemy model
from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column
from sqlalchemy import String, DateTime
from datetime import datetime
from uuid import UUID

class Base(DeclarativeBase):
    pass

class UserDB(Base):
    __tablename__ = "users"
    id: Mapped[UUID] = mapped_column(primary_key=True)
    email: Mapped[str] = mapped_column(String(255), unique=True, index=True)
    name: Mapped[str] = mapped_column(String(100))
    created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True))

# 4. Repository
from typing import Protocol
from uuid import UUID

class UserRepo(Protocol):
    async def get(self, id: UUID) -> User | None: ...
    async def get_by_email(self, email: str) -> User | None: ...
    async def save(self, user: User) -> User: ...
    async def list(self, limit: int = 100) -> list[User]: ...
    async def delete(self, id: UUID) -> bool: ...

# SQLAlchemy impl
class SQLAlchemyUserRepo:
    def __init__(self, session):
        self.session = session
    async def get(self, id: UUID) -> User | None:
        db_user = await self.session.get(UserDB, id)
        return User(**db_user.__dict__) if db_user else None
    # ... other methods`,

from fastapi import APIRouter, Depends, HTTPException, status
from uuid import UUID
from ...services.user_service import UserService
from ..deps import get_user_service
from ..schemas import UserCreate, UserUpdate, UserOut

router = APIRouter(prefix="/users", tags=["users"])

@router.post("", response_model=UserOut, status_code=201)
async def create_user(
    payload: UserCreate,
    service: UserService = Depends(get_user_service),
):
    try:
        user = await service.create(email=payload.email, name=payload.name)
        return UserOut.model_validate(user.__dict__)
    except ValueError as e:
        raise HTTPException(400, str(e))

@router.get("", response_model=list[UserOut])
async def list_users(
    limit: int = 100,
    service: UserService = Depends(get_user_service),
):
    users = await service.list(limit=limit)
    return [UserOut.model_validate(u.__dict__) for u in users]

@router.get("/{user_id}", response_model=UserOut)
async def get_user(user_id: UUID, service: UserService = Depends(get_user_service)):
    user = await service.get_by_id(user_id)
    if not user:
        raise HTTPException(404, "not found")
    return UserOut.model_validate(user.__dict__)

@router.patch("/{user_id}", response_model=UserOut)
async def update_user(
    user_id: UUID,
    payload: UserUpdate,
    service: UserService = Depends(get_user_service),
):
    user = await service.update(user_id, name=payload.name)
    if not user:
        raise HTTPException(404, "not found")
    return UserOut.model_validate(user.__dict__)

@router.delete("/{user_id}", status_code=204)
async def delete_user(user_id: UUID, service: UserService = Depends(get_user_service)):
    ok = await service.delete(user_id)
    if not ok:
        raise HTTPException(404, "not found")
